name: vital_step
description: "Vital Step Data Collection"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.68.0
  numberpicker: ^2.1.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fluttertoast: ^9.0.0
  http:  ^0.13.6
  get_storage: ^2.1.1
  url_launcher: ^6.3.0
  supabase_flutter: ^2.5.11
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  pdf: ^3.11.1
  printing: ^5.13.3
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  share_plus: ^7.2.2
  path_provider: ^2.1.1

dev_dependencies:
  build_runner: ^2.4.11
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_gen_runner: ^5.9.0
  flutter_launcher_icons: ^0.13.1


flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

flutter:
  uses-material-design: true
  assets:
    - assets/
