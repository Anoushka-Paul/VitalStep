# VitalStep API - Docker Compose for Local Development
version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - HUBSPOT_PAT=${HUBSPOT_PAT}
      - CORS_ORIGINS=*
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - with-cache

  # Optional: PostgreSQL (if not using Supabase)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=vitalstep
      - POSTGRES_PASSWORD=vitalstep123
      - POSTGRES_DB=vitalstep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - with-postgres

volumes:
  redis_data:
  postgres_data: